<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WC2026 — wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#1f2329; --mute:#8a8f98; --faint:#c4c8ce; --line:#d7dbe0;
    --fill:#eceef1; --fill2:#e2e5e9; --paper:#ffffff; --bg:#f5f6f8;
    --note:#2d6cdf; --noteBg:#eaf1ff;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',system-ui,sans-serif; background:#43474d; color:var(--ink);}

  /* top toolbar */
  .toolbar{position:sticky; top:0; z-index:100; background:#1f2329; color:#fff;
    display:flex; align-items:center; gap:14px; padding:10px 18px; flex-wrap:wrap;}
  .toolbar h1{font-size:14px; font-weight:700; margin:0; letter-spacing:.02em;}
  .toolbar .sub{font-size:11px; color:#9aa0a8;}
  .tabs{display:flex; gap:4px; margin-left:auto; flex-wrap:wrap;}
  .tabs button{font-family:inherit; font-size:11px; font-weight:600; color:#c4c8ce; background:#2c313a;
    border:none; border-radius:7px; padding:6px 11px; cursor:pointer;}
  .tabs button.on{background:#fff; color:#1f2329;}
  .legend{display:flex; gap:16px; padding:8px 18px; background:#2c313a; color:#aeb4bd; font-size:11px; flex-wrap:wrap;}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .swatch{width:13px; height:13px; border-radius:3px; display:inline-block; border:1px solid rgba(255,255,255,.15);}

  /* canvas */
  .canvas{padding:34px 24px 80px; display:flex; flex-wrap:wrap; gap:54px; justify-content:center; align-items:flex-start;}
  .frame{display:flex; gap:18px; align-items:flex-start;}
  .screen-wrap{display:flex; flex-direction:column; gap:9px;}
  .screen-label{color:#dfe2e6; font-size:12px; font-weight:600;}
  .screen-label b{color:#fff;}
  .phone{width:300px; height:640px; background:var(--bg); border-radius:26px; border:9px solid #14161a;
    overflow:hidden; position:relative; box-shadow:0 18px 50px rgba(0,0,0,.4); display:flex; flex-direction:column;}
  .vp{flex:1; overflow-y:auto;}
  .vp::-webkit-scrollbar{width:0;}

  /* wireframe primitives */
  .wf{padding:14px;}
  .box{background:var(--fill); border:1px solid var(--line); border-radius:8px;}
  .box.alt{background:var(--fill2);}
  .box.x{position:relative;}
  .box.x::after{content:""; position:absolute; inset:0;
    background:linear-gradient(135deg,transparent 47%,var(--faint) 48%,var(--faint) 52%,transparent 53%),
               linear-gradient(45deg,transparent 47%,var(--faint) 48%,var(--faint) 52%,transparent 53%);}
  .lbl{font-size:9px; font-weight:600; color:var(--mute); letter-spacing:.04em; text-transform:uppercase;}
  .ph{height:9px; border-radius:4px; background:var(--faint);}
  .ph.lg{height:13px;}
  .ph.xl{height:22px;}
  .row{display:flex; align-items:center; gap:8px;}
  .col{display:flex; flex-direction:column;}
  .pillz{display:inline-block; font-size:9px; font-weight:600; color:var(--mute); background:var(--fill2);
    border:1px solid var(--line); border-radius:999px; padding:3px 8px;}
  .divider{height:1px; background:var(--line);}
  .num{width:18px; height:18px; border-radius:50%; background:var(--note); color:#fff; font-size:10px;
    font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex:none;}
  .center{display:flex; align-items:center; justify-content:center;}

  /* faux nav */
  .wnav{display:flex; background:#14161a; padding:7px 6px 9px;}
  .wnav div{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; color:#7b818b; font-size:8px; font-weight:600;}
  .wnav .ic{width:18px; height:18px; border-radius:5px; background:#2c313a;}
  .wnav .on{color:#fff;} .wnav .on .ic{background:#fff;}

  .header{display:flex; align-items:center; gap:8px; padding:12px 14px 8px;}

  /* annotation panel */
  .notes{width:300px; background:var(--paper); border-radius:12px; padding:16px 16px 6px; align-self:stretch;}
  .notes h3{font-size:12px; margin:0 0 4px; color:var(--ink); letter-spacing:.02em;}
  .notes .scr{font-size:10px; color:var(--mute); margin-bottom:12px; text-transform:uppercase; letter-spacing:.05em; font-weight:600;}
  .note{display:flex; gap:9px; margin-bottom:13px;}
  .note .t{font-size:12px; line-height:1.45; color:#3a3f47;}
  .note .t b{color:var(--ink);}
  .intro{max-width:760px; margin:0 auto 8px; background:var(--paper); border-radius:12px; padding:20px 24px; color:#3a3f47;}
  .intro h2{margin:0 0 8px; font-size:18px; color:var(--ink);}
  .intro p{font-size:13px; line-height:1.55; margin:0 0 8px;}
  .seg{display:flex; gap:5px; padding:8px 14px 2px;}
  .seg div{flex:1; text-align:center; font-size:9px; font-weight:600; color:var(--mute); background:var(--fill);
    border:1px solid var(--line); border-radius:6px; padding:5px 0;}
  .seg div.on{background:var(--ink); color:#fff; border-color:var(--ink);}
  .statebar{font-size:9px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#fff;
    background:var(--note); padding:4px 8px; border-radius:6px; display:inline-block;}
  .hidden{display:none;}
</style>
</head>
<body>
  <div class="toolbar">
    <h1>WC2026 — wireframes</h1>
    <span class="sub">Low-fidelity · annotated · phone-first</span>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="legend">
    <span><i class="swatch" style="background:#eceef1"></i> content block</span>
    <span><i class="swatch" style="background:#c4c8ce"></i> text / data slot</span>
    <span><i class="swatch" style="background:#e2e5e9"></i> interactive / themed</span>
    <span><i class="swatch" style="background:#2d6cdf"></i> annotation</span>
    <span style="margin-left:auto; color:#7b818b;">Annotations are behaviour &amp; data notes — not visual direction.</span>
  </div>

  <div class="canvas" id="canvas"></div>

<script>
/* ---------- tiny helpers to keep wireframe markup terse ---------- */
const ph=(c="",s="")=>`<div class="ph ${c}" style="${s}"></div>`;
const box=(inner="",cls="",s="")=>`<div class="box ${cls}" style="${s}">${inner}</div>`;
const lbl=(t)=>`<div class="lbl">${t}</div>`;
const note=(n,t)=>`<div class="note"><span class="num">${n}</span><div class="t">${t}</div></div>`;

/* faux bottom nav, with active key */
const nav=(active)=>`<div class="wnav">
  ${[["Matches","matches"],["Teams","teams"],["Insights","insights"]].map(([t,k])=>
    `<div class="${active===k?'on':''}"><span class="ic"></span>${t}</div>`).join("")}
</div>`;

/* ============================ SCREENS ============================ */
const SCREENS = {};

/* ---- 0. HOME + NAV SHELL ---- */
SCREENS.home = {
  label:`<b>1 · Home</b> + nav shell`,
  body:`
   <div class="vp"><div class="wf" style="padding-bottom:0">
     ${box(`<div style="padding:12px 14px">
        ${lbl("App wordmark / date")}
        ${ph("xl","width:60%;margin-top:8px")}
        ${ph("","width:40%;margin-top:8px;background:#d7dbe0")}
      </div>`,"","background:#e2e5e9;border:none;border-radius:0")}
     <div style="padding:14px 0 4px">${lbl("⬤ Featured match (hero card)")}</div>
     ${box(`<div style="display:flex;height:96px">
        <div style="flex:1;border-right:1px solid var(--line);padding:12px">${ph("","width:50%")}<div style="margin-top:26px">${ph("xl","width:70%")}</div></div>
        <div style="flex:1;padding:12px;display:flex;flex-direction:column;align-items:flex-end"><div style="width:50%">${ph()}</div><div style="margin-top:26px;width:70%">${ph("xl")}</div></div>
      </div>`,"x")}
     <div style="padding:16px 0 4px">${lbl("Today's fixtures →")}</div>
     ${box(`<div style="padding:11px"><div class="row">${ph("","width:30%")}<span class="pillz" style="margin-left:auto">KO time</span></div></div>`,"","margin-bottom:8px")}
     ${box(`<div style="padding:11px"><div class="row">${ph("","width:30%")}<span class="pillz" style="margin-left:auto">KO time</span></div></div>`)}
     <div style="padding:16px 0 4px">${lbl("Insight of the day")}</div>
     ${box(`<div style="padding:14px">${lbl("Dark horse")}${ph("lg","width:55%;margin-top:8px")}${ph("","width:85%;margin-top:6px")}</div>`,"x","margin-bottom:14px")}
   </div></div>
   ${nav("matches")}`,
  notes:[
    "<b>Entry screen.</b> Sets the tone — a single hero fixture themed in both teams' kits, then a short scannable list. Goal: one tap to anything.",
    "<b>Hero card</b> reuses the split-kit treatment from the result page at reduced scale. Tapping opens the Match page in whichever state the match is in.",
    "<b>Today's fixtures</b> pulls the next N kick-offs. Time shown in the user's local zone (stored TZ → converted).",
    "<b>Insight of the day</b> rotates through the editorial stat cards (dark horse, defying the odds…). Tapping deep-links to the relevant team.",
    "<b>Bottom nav</b> is the persistent shell across Matches / Teams / Insights. Detail screens (match, team) push over the top with a back affordance."
  ]
};

/* ---- 2. FIXTURES + GROUPS ---- */
SCREENS.fixtures = {
  label:`<b>2 · Fixtures</b> + groups`,
  body:`
   <div class="vp">
     <div class="header">${ph("xl","width:45%")}</div>
     <div class="seg"><div class="on">Fixtures</div><div>Groups</div></div>
     <div class="wf">
       ${lbl("Day / group filter")}
       <div class="row" style="margin:8px 0 14px;flex-wrap:wrap;gap:6px">
         <span class="pillz">All</span><span class="pillz">Fri 18</span><span class="pillz">Sat 19</span><span class="pillz">Sun 20</span>
       </div>
       ${["","",""].map(()=>box(`<div style="display:flex;height:80px">
          <div style="flex:1;border-right:1px solid var(--line);padding:11px">${ph("","width:55%")}<div style="margin-top:20px">${ph("lg","width:60%")}</div></div>
          <div style="flex:1;padding:11px;display:flex;flex-direction:column;align-items:flex-end"><div style="width:55%">${ph()}</div><div style="margin-top:20px;width:60%">${ph("lg")}</div></div>
        </div>`,"x","margin-bottom:10px")).join("")}
     </div>
   </div>
   ${nav("matches")}`,
  notes:[
    "<b>Two-tab screen:</b> Fixtures (default) and Groups, sharing one header.",
    "<b>Filter row</b> scrolls horizontally — by match-day and/or by group. Persist last choice (localStorage now, user pref later).",
    "<b>Fixture card</b> = mini split-kit. Shows KO time + group when scheduled, swaps to scoreline when finished, and a LIVE marker when in progress.",
    "Cards are the single most-reused component. One card renders all 104 matches — themed purely from the two teams' colour rows.",
    "Tapping a card → Match page (state depends on fixture status)."
  ]
};

SCREENS.groups = {
  label:`<b>2b · Groups</b> (tab)`,
  body:`
   <div class="vp">
     <div class="header">${ph("xl","width:45%")}</div>
     <div class="seg"><div>Fixtures</div><div class="on">Groups</div></div>
     <div class="wf">
       ${["A","B"].map(g=>box(`
         <div style="background:#14161a;color:#fff;padding:7px 12px;font-size:11px;font-weight:700;border-radius:8px 8px 0 0">Group ${g}</div>
         <div style="padding:6px 12px 10px">
           <div class="row" style="font-size:8px;color:var(--mute);font-weight:600;padding:5px 0;border-bottom:1px solid var(--line)">
             <span style="flex:1">TEAM</span><span style="width:20px;text-align:center">P</span><span style="width:24px;text-align:center">GD</span><span style="width:26px;text-align:center">PTS</span></div>
           ${[0,1,2,3].map(i=>`<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)">
             <span style="width:5px;height:16px;border-radius:2px;background:var(--faint)"></span>
             <span style="flex:1;margin-left:7px">${ph("","width:70%")}</span>
             <span style="width:20px"></span><span style="width:24px"></span><span style="width:26px">${ph("","width:60%")}</span></div>`).join("")}
         </div>`,"","margin-bottom:14px")).join("")}
     </div>
   </div>
   ${nav("matches")}`,
  notes:[
    "<b>Standings table</b> per group: played, GD, points (expandable to full W-D-L on tap).",
    "<b>Colour bar</b> on each row carries the team's primary — the one spot of kit colour in an otherwise neutral table.",
    "Top two rows visually emphasised (qualifying positions). 2026 format = 12 groups of 4; best third-placed teams also advance — design the table to flag that third-place edge case.",
    "Row tap → Team page."
  ]
};

/* ---- 3. TEAM / SQUAD ---- */
SCREENS.team = {
  label:`<b>3 · Team</b> / squad`,
  body:`
   <div class="vp">
     ${box(`<div style="padding:18px 16px 20px;position:relative">
        ${ph("","width:22px;height:22px;border-radius:5px")}
        <div style="margin-top:10px">${ph("xl","width:55%;height:34px")}</div>
        ${ph("lg","width:40%;margin-top:8px")}
        <div class="row" style="margin-top:16px;gap:18px">
          <div>${lbl("Seed")}${ph("lg","width:28px;margin-top:5px")}</div>
          <div>${lbl("Odds")}${ph("lg","width:36px;margin-top:5px")}</div>
          <div>${lbl("Group")}${ph("lg","width:20px;margin-top:5px")}</div>
        </div>
        <div style="margin-top:14px">${lbl("Form · last 5")}
          <div class="row" style="margin-top:6px;gap:4px">${[0,0,0,0,0].map(()=>`<span style="width:18px;height:18px;border-radius:4px;background:var(--faint)"></span>`).join("")}</div>
        </div>
      </div>`,"x alt","border:none;border-radius:0")}
     <div class="wf">
       ${box(`<div style="padding:12px 14px">${lbl("● Headline / news snippet")}${ph("lg","width:90%;margin-top:8px")}</div>`,"","margin-bottom:16px")}
       ${lbl("Squad")}
       ${box(`<div>${[0,1,2,3].map((i)=>`<div class="row" style="padding:8px 12px;${i<3?'border-bottom:1px solid var(--line)':''}">
          <span style="width:22px;height:22px;border-radius:6px;background:var(--fill2)"></span>
          <span style="flex:1;margin-left:10px">${ph("","width:50%")}</span><span class="pillz">POS</span></div>`).join("")}</div>`,"","margin:8px 0 16px")}
       ${lbl("This team's fixtures")}
       ${box(`<div style="height:60px"></div>`,"x","margin-top:8px")}
     </div>
   </div>
   ${nav("teams")}`,
  notes:[
    "<b>Themed hero</b> — the whole header is the team's kit. Big code + name, key facts (seed, odds, group), and form strip.",
    "<b>Form</b> = W/D/L last five. Colour-coded chips (green/amber/red) — these stay semantic, not kit-themed, for legibility.",
    "<b>News snippet</b> sits on the team's primary; uses the auto-contrast text helper so it's readable on any kit.",
    "<b>Squad list</b>: number, name, position. Tappable rows reserved for a future player detail screen.",
    "<b>Fixtures</b> for this team reuse the same fixture card component from screen 2."
  ]
};

/* ---- 4. KNOCKOUT + STATS ---- */
SCREENS.insights = {
  label:`<b>4 · Knockout</b> + stats`,
  body:`
   <div class="vp">
     <div class="header">${ph("xl","width:45%")}</div>
     <div class="seg"><div class="on">Bracket</div><div>Scorers</div><div>Stories</div></div>
     <div class="wf">
       ${lbl("Knockout tree — scrolls horizontally →")}
       <div style="display:flex;gap:10px;margin-top:10px;overflow:hidden">
         ${[0,1,2].map(c=>`<div style="flex:none;width:84px;display:flex;flex-direction:column;gap:${c===1?'30px':'10px'};margin-top:${c===1?'14px':'0'}">
            <div class="lbl">${["QF","SF","FINAL"][c]}</div>
            ${Array(c===0?3:c===1?2:1).fill(0).map(()=>box(`<div style="padding:6px"><div class="row" style="padding:3px 0"><span style="width:4px;height:11px;background:var(--faint)"></span><span style="flex:1;margin-left:5px">${ph("","width:80%")}</span></div><div class="row" style="padding:3px 0"><span style="width:4px;height:11px;background:var(--faint)"></span><span style="flex:1;margin-left:5px">${ph("","width:80%")}</span></div></div>`)).join("")}
          </div>`).join("")}
       </div>
       <div style="margin-top:18px">${lbl("(Scorers tab) leaderboard")}</div>
       ${[0,1,2].map(i=>box(`<div class="row" style="padding:9px 12px"><span class="lbl" style="width:14px">${i+1}</span><div style="flex:1;margin-left:8px">${ph("","width:55%")}<div style="height:5px;border-radius:3px;background:var(--fill2);margin-top:6px"><div style="height:100%;width:${70-i*18}%;background:var(--faint);border-radius:3px"></div></div></div><span style="margin-left:8px">${ph("lg","width:18px")}</span></div>`,"","margin-top:8px")).join("")}
     </div>
   </div>
   ${nav("insights")}`,
  notes:[
    "<b>Three tabs:</b> Bracket, Scorers, Stories — the tournament's data + narrative hub.",
    "<b>Bracket</b> scrolls horizontally (rounds) on mobile. 2026 starts at a Round of 32, so design for the extra column. Each cell = mini team chip; tap → Match page.",
    "<b>Scorers</b> leaderboard with bar = goals, secondary = assists. Derived live from match-events, not stored. Tap → Team page.",
    "<b>Stories</b> tab = editorial insight cards (highest scoring, most cards, dark horse, defying the odds), each themed to its subject team.",
    "Champion cell at the end of the bracket is a moment — worth a celebratory treatment in design."
  ]
};

/* ---- MATCH PAGE — 3 STATES ---- */
const matchShell = (stateLabel, mid, extra) => `
   <div class="vp">
     ${box(`<div style="padding:10px 12px"><span class="statebar">${stateLabel}</span>
        <div class="row" style="margin-top:10px;gap:6px;font-size:8px;color:var(--mute)">
          <span style="flex:1">Group · date</span><span style="flex:1;text-align:right">KO · venue</span></div>
        <div class="row center" style="margin-top:6px;gap:10px">
          ${ph("xl","width:64px;height:30px")}
          <div style="width:46px;height:46px;border-radius:50%;border:1.5px solid var(--faint)" class="center">${mid}</div>
          ${ph("xl","width:64px;height:30px")}
        </div>
      </div>`,"x","border:none;border-radius:0")}
     <div class="wf">${extra}</div>
   </div>`;

SCREENS.match_up = {
  label:`<b>5a · Match</b> — upcoming`,
  body: matchShell("Upcoming",
    `<span class="lbl">vs</span>`,
    `<div style="display:flex;gap:12px">
       <div style="flex:1">${lbl("Title odds")}${ph("","width:50%;margin-top:6px")}<div style="margin-top:12px">${lbl("That's a fact")}${ph("","width:90%;margin-top:6px")}${ph("","width:70%;margin-top:4px")}</div></div>
       <div style="flex:1;text-align:right">${lbl("Title odds")}<div style="display:flex;justify-content:flex-end">${ph("","width:50%;margin-top:6px")}</div></div>
     </div>
     <div style="margin-top:18px">${lbl("Form — last 5, both teams")}${box(`<div style="height:34px"></div>`,"","margin-top:8px")}</div>
     <div style="margin-top:14px">${lbl("Head-to-head — recent meetings")}${box(`<div style="height:54px"></div>`,"","margin-top:8px")}</div>
     <div style="margin-top:14px">${lbl("Venue + fun fact")}${box(`<div style="height:48px"></div>`,"x","margin-top:8px")}</div>`),
  notes:[
    "<b>State 1 of 3.</b> Same page, before kick-off. The score circle shows 'vs'; no timeline yet.",
    "<b>Pre-match content</b>: odds + fun fact (as in the concept), then the extra build-up modules — form for both sides, H2H history, venue + fun fact.",
    "<b>H2H</b> = recent meetings list. Keep it compact; it's supporting context, not the star.",
    "Design the page so these modules <b>collapse away</b> as the match starts — same layout morphs into the live state, never a separate screen.",
    "A countdown or 'Kicks off in…' marker is an optional nice-to-have here."
  ]
};

SCREENS.match_live = {
  label:`<b>5b · Match</b> — live`,
  body: matchShell("● Live · 67'",
    `${ph("","width:14px;height:18px")}`,
    `<div class="row" style="justify-content:center;gap:8px;margin-bottom:14px"><span class="pillz">● LIVE 67'</span></div>
     ${lbl("Live event timeline (builds top-down as it happens)")}
     <div style="position:relative;margin-top:12px">
       <div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)"></div>
       ${[["r"],["l"],["r"],["l"]].map(([s])=>`<div style="display:flex;justify-content:${s==='r'?'flex-end':'flex-start'};margin-bottom:14px">
          <div style="width:48%;display:flex;${s==='r'?'flex-direction:row-reverse;':''}align-items:center;gap:6px">
            <span class="pillz">__'</span><span style="width:12px;height:12px;border-radius:50%;background:var(--fill2)"></span>
            <div style="flex:1">${ph("","width:80%")}</div></div></div>`).join("")}
     </div>
     <div style="margin-top:8px">${lbl("Live stats strip (poss, shots, cards)")}${box(`<div style="height:40px"></div>`,"","margin-top:8px")}</div>`),
  notes:[
    "<b>State 2 of 3.</b> Score is live and updating; state bar shows minute + a LIVE marker.",
    "<b>Timeline builds in real time</b> — new events animate in at the top. Same EventItem component as the finished state.",
    "<b>Live stats strip</b> (possession, shots, cards) appears only in this state. Data granularity depends on the chosen football API — flagged in the plan as a feed-selection criterion.",
    "Polling/refresh: the page subscribes to updates (Supabase realtime, or polling the API sync). Show a subtle 'updating' pulse rather than a hard reload.",
    "Pre-match modules (H2H, build-up facts) are gone or minimised — the timeline is now the focus."
  ]
};

SCREENS.match_done = {
  label:`<b>5c · Match</b> — finished`,
  body: matchShell("Full time",
    `<div class="row" style="gap:3px">${ph("","width:11px;height:16px")}<span style="width:3px;height:3px;border-radius:50%;background:var(--faint)"></span>${ph("","width:11px;height:16px")}</div>`,
    `<div style="display:flex;gap:12px">
       <div style="flex:1">${lbl("Title odds")}${ph("","width:50%;margin-top:6px")}<div style="margin-top:12px">${lbl("That's a fact")}${ph("","width:90%;margin-top:6px")}${ph("","width:70%;margin-top:4px")}</div></div>
       <div style="flex:1;text-align:right">${lbl("Title odds")}<div style="display:flex;justify-content:flex-end">${ph("","width:50%;margin-top:6px")}</div><div style="margin-top:12px">${lbl("That's a fact")}<div style="display:flex;justify-content:flex-end">${ph("","width:90%;margin-top:6px")}</div></div></div>
     </div>
     <div style="margin-top:18px">${lbl("Full goal / card timeline")}</div>
     <div style="position:relative;margin-top:12px">
       <div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)"></div>
       ${[["r"],["l"],["l"],["r"],["r"]].map(([s])=>`<div style="display:flex;justify-content:${s==='r'?'flex-end':'flex-start'};margin-bottom:13px">
          <div style="width:48%;display:flex;${s==='r'?'flex-direction:row-reverse;':''}align-items:flex-start;gap:6px">
            <span class="pillz">__'</span><span style="width:12px;height:12px;border-radius:50%;background:var(--fill2)"></span>
            <div style="flex:1">${ph("","width:85%")}${ph("","width:55%;margin-top:4px")}</div></div></div>`).join("")}
     </div>
     <div class="center" style="margin-top:14px"><span class="pillz">★ Man of the match</span></div>
     <div style="margin-top:14px">${box(`<div class="center" style="height:36px"><span class="lbl">Share this result ↗</span></div>`,"")}</div>`),
  notes:[
    "<b>State 3 of 3 — the hero.</b> This is the screen you designed: full score, fact panels both sides, complete timeline, MOM.",
    "<b>Timeline</b> events branch left/right off the centre line — scorer + assist, icon, minute pill. HT marker mid-line.",
    "<b>Fact panels</b> now show on both sides (away side gains its 'That's a fact' cell vs the upcoming state).",
    "<b>MOM</b> badge anchors the bottom of the events.",
    "<b>Share</b> exports a kit-themed social card of the result — the growth loop noted in the plan. Worth designing the export frame deliberately."
  ]
};

/* ============================ RENDER ============================ */
const ORDER = ["home","fixtures","groups","team","insights","match_up","match_live","match_done"];
const GROUPSET = {
  "All screens": ORDER,
  "Browse": ["home","fixtures","groups","team"],
  "Insights": ["insights"],
  "Match states": ["match_up","match_live","match_done"],
};

function frame(key){
  const s=SCREENS[key];
  return `<div class="frame">
    <div class="screen-wrap">
      <div class="screen-label">${s.label}</div>
      <div class="phone">${s.body}</div>
    </div>
    <div class="notes">
      <h3>Annotations</h3>
      <div class="scr">${s.label.replace(/<[^>]+>/g,"")}</div>
      ${s.notes.map((t,i)=>note(i+1,t)).join("")}
    </div>
  </div>`;
}

function render(setName){
  const keys = GROUPSET[setName];
  const intro = setName==="All screens" ? `<div class="intro">
     <h2>WC2026 — wireframe set</h2>
     <p>Low-fidelity, annotated wireframes for the World Cup 2026 app, phone-first. Greyscale and structural by design: these define <b>layout, hierarchy, content slots and behaviour</b> so you can design the visual layer on top. Numbered notes beside each screen are behaviour &amp; data annotations, not visual direction.</p>
     <p>Use the tabs top-right to focus on a section. The match page is shown across its three states — upcoming, live and finished — as one morphing screen, not three separate designs.</p>
   </div>` : "";
  document.getElementById("canvas").innerHTML = intro + keys.map(frame).join("");
}

// tabs
const tabsEl=document.getElementById("tabs");
Object.keys(GROUPSET).forEach((name,i)=>{
  const b=document.createElement("button");
  b.textContent=name; if(i===0)b.classList.add("on");
  b.onclick=()=>{ [...tabsEl.children].forEach(c=>c.classList.remove("on")); b.classList.add("on"); render(name); window.scrollTo(0,0); };
  tabsEl.appendChild(b);
});
render("All screens");
</script>
</body>
</html>
